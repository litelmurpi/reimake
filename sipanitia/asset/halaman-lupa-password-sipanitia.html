<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center py-8">
<!-- Mobile Container Wrapper -->
<div class="w-[375px] max-w-full bg-surface shadow-[0_4px_24px_rgba(0,0,0,0.06)] rounded-xl overflow-hidden flex flex-col mx-auto relative border border-divider">
<!-- ========================================== -->
<!-- STATE 1: INITIAL REQUEST                   -->
<!-- ========================================== -->
<!-- Top App Bar (Custom for Auth screen, based on Brand Anchors but modified for context) -->
<header class="bg-surface flex items-center h-top-bar-height px-container-padding border-b border-divider sticky top-0 z-10">
<button aria-label="Kembali" class="text-on-surface hover:bg-surface-container-low p-2 rounded-full transition-colors active:scale-95 mr-4">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1">Lupa Password</h1>
</header>
<!-- Main Content Canvas - State 1 -->
<main class="px-container-padding py-8 flex flex-col items-center">
<!-- Icon -->
<div class="w-20 h-20 bg-surface-container-low rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[40px] text-primary-container" style="font-size: 40px; font-variation-settings: 'wght' 300;">lock</span>
</div>
<!-- Instruction Text -->
<p class="font-body-md text-body-md text-secondary text-center mb-8 w-full max-w-[280px]">
                Masukkan email yang terdaftar, kami akan kirim link reset password
            </p>
<!-- Form -->
<form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Input Group -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Alamat Email</label>
<input class="w-full h-12 px-4 bg-surface border border-outline-variant rounded-lg font-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors placeholder:text-secondary-fixed-dim" id="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
<!-- Primary Button -->
<button class="w-full min-h-[48px] bg-primary-container text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-primary-fixed-variant active:scale-[0.98] transition-all shadow-sm" type="submit">
                    Kirim Link Reset
                </button>
</form>
</main>
<!-- ========================================== -->
<!-- SEPARATOR                                  -->
<!-- ========================================== -->
<div class="flex items-center w-full px-container-padding py-8 opacity-60">
<div class="flex-1 border-t border-divider"></div>
<span class="px-4 font-label-sm text-label-sm text-secondary uppercase tracking-widest">— setelah berhasil —</span>
<div class="flex-1 border-t border-divider"></div>
</div>
<!-- ========================================== -->
<!-- STATE 2: SUCCESS                           -->
<!-- ========================================== -->
<div class="px-container-padding pb-12 flex flex-col items-center">
<!-- Success Card -->
<div class="w-full bg-status-completed-bg rounded-xl p-4 flex flex-col items-center shadow-sm border border-divider mb-8">
<div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-[28px] text-status-completed-text fill">check_circle</span>
</div>
<p class="font-body-md text-body-md text-status-completed-text text-center px-2">
                    Link reset sudah dikirim ke email kamu. Cek inbox (atau spam).
                </p>
</div>
<!-- Secondary Button -->
<button class="w-full min-h-[48px] bg-surface text-primary-container border border-primary-container font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-surface-container-low active:scale-[0.98] transition-all">
                Kembali ke Login
            </button>
</div>
