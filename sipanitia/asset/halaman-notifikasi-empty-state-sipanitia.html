<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col max-w-[375px] mx-auto overflow-hidden relative shadow-xl">
<!-- Top App Bar (Custom for Notifications) -->
<header class="fixed top-0 w-full max-w-[375px] z-50 bg-surface-container-lowest shadow-sm flex items-center justify-between px-container-padding h-top-bar-height border-b border-divider">
<div class="flex items-center gap-2">
<button aria-label="Go back" class="p-1 -ml-1 text-on-surface hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Notifikasi</h1>
</div>
<button class="text-primary font-label-md text-label-md hover:opacity-80 transition-opacity">Tandai semua dibaca</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col mt-[56px]">
<!-- Tabs -->
<div class="flex border-b border-divider bg-surface-container-lowest">
<button class="flex-1 py-3 text-center border-b-2 border-primary text-primary font-label-md text-label-md">
                Semua
            </button>
<button class="flex-1 py-3 text-center border-b-2 border-transparent text-secondary hover:bg-surface-container-low transition-colors font-label-md text-label-md flex items-center justify-center gap-1">
                Belum Dibaca
                <span class="bg-surface-container-high text-on-surface-variant rounded-full px-1.5 py-0.5 text-[10px] leading-none font-semibold">0</span>
</button>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center px-8 text-center bg-surface-container-lowest pb-24">
<!-- Illustration / Icon -->
<div class="relative mb-6">
<!-- Large Decorative Circle -->
<div class="absolute inset-0 bg-primary-fixed-dim opacity-20 rounded-full scale-150 animate-pulse"></div>
<!-- Main Icon Area -->
<div class="w-[100px] h-[100px] bg-surface-container flex items-center justify-center rounded-full border-2 border-primary-fixed relative z-10 shadow-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 0; font-weight: 300;">notifications</span>
<!-- Checkmark Badge -->
<div class="absolute -bottom-1 -right-1 w-8 h-8 bg-progress-high rounded-full flex items-center justify-center border-2 border-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</div>
<!-- Typography -->
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Tidak ada notifikasi</h2>
<p class="font-body-md text-body-md text-secondary">Semua tugas on track! 🎉</p>
</div>
