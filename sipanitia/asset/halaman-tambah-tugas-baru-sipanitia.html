<body class="bg-surface-container-lowest text-on-surface font-body-md antialiased h-screen flex flex-col">
<!-- Header -->
<header class="flex items-center justify-between px-container-padding h-top-bar-height bg-surface-container-lowest shrink-0 border-b border-divider shadow-sm sticky top-0 z-10">
<div class="w-8"></div> <!-- Spacer for centering -->
<h1 class="font-headline-md text-headline-md font-bold text-on-surface text-center flex-1">Tambah Tugas Baru</h1>
<button class="w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors rounded-full focus:bg-surface-container-low focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<!-- Scrollable Form Area -->
<main class="flex-1 overflow-y-auto px-container-padding py-4 space-y-4">
<!-- Divisi Dropdown -->
<div>
<label class="label-base" for="divisi">Divisi</label>
<div class="relative">
<select class="input-base appearance-none w-full" id="divisi">
<option disabled="" selected="" value="">Pilih divisi</option>
<option value="bph">BPH</option>
<option value="humas">Sie Humas</option>
<option value="dekdok">Sie Dekdok</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Nama Tugas Input -->
<div>
<label class="label-base" for="nama_tugas">Nama Tugas</label>
<input class="input-base" id="nama_tugas" placeholder="Contoh: Buat Proposal Kegiatan" type="text"/>
</div>
<!-- Target Tanggal Datepicker -->
<div>
<label class="label-base" for="target_tanggal">Target Tanggal</label>
<div class="relative">
<input class="input-base pr-10" id="target_tanggal" placeholder="DD/MM/YYYY" type="text"/>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</div>
<!-- Penanggung Jawab Searchable Select (Mockup) -->
<div>
<label class="label-base" for="pj">Penanggung Jawab</label>
<div class="relative">
<div class="input-base flex items-center justify-between cursor-text bg-surface-container-lowest" tabindex="0">
<span class="text-on-surface-variant">Cari nama PJ...</span>
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<!-- Dropdown Mockup (Hidden by default, shown here for structure) -->
<!-- <div class="absolute z-10 w-full mt-1 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-md max-h-48 overflow-y-auto">
                    <div class="flex items-center gap-3 p-3 hover:bg-surface-container cursor-pointer border-b border-divider">
                        <img src="placeholder" data-alt="A small circular avatar placeholder image showing a generic profile silhouette in soft grey tones on a light background, clean corporate style." class="w-8 h-8 rounded-full object-cover bg-surface-variant">
                        <span class="font-body-md text-on-surface">Budi Santoso</span>
                    </div>
                </div> -->
</div>
</div>
<!-- Status Dropdown (Mockup with colors) -->
<div>
<label class="label-base" for="status">Status</label>
<div class="relative">
<div class="input-base flex items-center justify-between cursor-pointer bg-surface-container-lowest" tabindex="0">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-status-pending-bg block"></span>
<span class="text-on-surface">Belum Mulai</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
</div>
</div>
<!-- Catatan Textarea -->
<div>
<label class="label-base" for="catatan">Catatan</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-surface-container-lowest px-4 py-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-none" id="catatan" placeholder="Tambahkan catatan jika perlu" rows="4"></textarea>
</div>
</main>
<!-- Bottom Sticky Action Bar -->
<div class="shrink-0 p-container-padding bg-surface-container-lowest shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t border-divider flex flex-col gap-[12px] z-10">
<button class="w-full h-[48px] rounded-xl border border-primary text-primary font-label-md text-label-md font-semibold flex items-center justify-center hover:bg-surface-container transition-colors focus:ring-2 focus:ring-primary focus:outline-none">
            Batal
        </button>
<button class="w-full h-[48px] rounded-xl bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center justify-center hover:opacity-90 transition-opacity focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:outline-none shadow-sm">
            Simpan
        </button>
