<body class="bg-surface-container-lowest flex justify-center min-h-screen">
<div class="w-full max-w-md bg-background flex flex-col relative shadow-2xl">
<!-- Transactional Top App Bar -->
<header class="h-top-bar-height bg-surface-container-lowest flex items-center px-container-padding sticky top-0 z-50 border-b border-divider">
<button class="absolute left-4 p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm flex-1 text-center text-on-surface">Buat Password Baru</h1>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-container-padding pt-10 pb-8 flex flex-col">
<!-- Hero Graphic -->
<div class="flex justify-center mb-10">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[64px] text-primary-container" data-icon="shield_lock">shield_lock</span>
</div>
</div>
<!-- Reset Password Form -->
<form class="flex flex-col gap-6 flex-1">
<!-- New Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="new_password">Password Baru</label>
<div class="relative">
<input class="w-full h-12 rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pr-12 font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-secondary shadow-sm" id="new_password" placeholder="Masukkan password baru" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary p-1 hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-secondary pl-1">Minimum 8 karakter</p>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Konfirmasi Password Baru</label>
<div class="relative">
<input class="w-full h-12 rounded-xl border border-outline-variant bg-surface-container-lowest px-4 pr-12 font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all placeholder:text-secondary shadow-sm" id="confirm_password" placeholder="Ulangi password baru" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary p-1 hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Match Indicators Preview (Both shown as requested for preview) -->
<div class="flex flex-col gap-1.5 mt-2 pl-1 bg-surface-container-low p-3 rounded-lg border border-divider">
<div class="flex items-center gap-2 text-error">
<span class="material-symbols-outlined text-[16px]" data-icon="cancel" style="font-variation-settings: 'FILL' 1;">cancel</span>
<span class="font-label-md text-label-md">Password tidak cocok</span>
</div>
<div class="flex items-center gap-2 text-progress-high">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md">Password cocok</span>
</div>
</div>
</div>
<!-- Spacer to push CTA to bottom if needed on taller screens -->
<div class="flex-1 min-h-[40px]"></div>
<!-- Primary Action -->
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-md mt-auto mb-4" type="button">
                    Simpan Password Baru
                </button>
</form>
</main>
</div>
</body></html>
