<body class="bg-background min-h-screen text-on-background font-body-md antialiased selection:bg-primary-container selection:text-on-primary max-w-[375px] mx-auto relative shadow-2xl">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-highest text-primary dark:text-primary-fixed font-headline-sm text-headline-sm fixed top-0 w-full h-[56px] border-b border-outline-variant dark:border-outline shadow-sm dark:shadow-none flex items-center px-container-padding w-full z-50 max-w-[375px] mx-auto bg-surface-container-lowest">
<button aria-label="Go back" class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-container-high transition-colors active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="ml-2 font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed flex-1">Change Password</h1>
</header>
<!-- Main Content Area -->
<main class="pt-[72px] pb-[88px] px-container-padding">
<form class="flex flex-col gap-component-gap">
<!-- Current Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="current-password">Password Saat Ini</label>
<div class="relative">
<input class="w-full h-[48px] px-4 py-3 rounded-lg border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface bg-surface-container-lowest pr-12" id="current-password" placeholder="Masukkan password saat ini" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Subtle Divider -->
<div class="h-px bg-divider w-full my-2"></div>
<!-- New Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="new-password">Password Baru</label>
<div class="relative">
<input class="w-full h-[48px] px-4 py-3 rounded-lg border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface bg-surface-container-lowest pr-12" id="new-password" placeholder="Masukkan password baru" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<span class="font-label-sm text-label-sm text-secondary mt-1">Minimum 8 karakter</span>
</div>
<!-- Confirm New Password -->
<div class="flex flex-col gap-1 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="confirm-password">Konfirmasi Password Baru</label>
<div class="relative">
<input class="w-full h-[48px] px-4 py-3 rounded-lg border border-outline-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors font-body-md text-body-md text-on-surface bg-surface-container-lowest pr-12" id="confirm-password" placeholder="Ulangi password baru" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="mt-8">
<button class="w-full h-[48px] bg-primary-container text-on-primary font-label-md text-label-md rounded-[12px] flex items-center justify-center hover:bg-primary transition-colors active:scale-95 shadow-[0_1px_3px_rgba(0,0,0,0.08)]" type="submit">
                    Simpan Password
                </button>
</div>
</form>
</main>
<script>
        // Simple password toggle logic for the demo
        document.querySelectorAll('button[aria-label="Toggle password visibility"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });
    </script>
