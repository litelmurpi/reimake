<body class="bg-surface font-body-md text-on-surface h-screen flex flex-col antialiased overflow-hidden">
<!-- Top 40% Gradient Area -->
<div class="h-[353px] bg-gradient-to-b from-primary-container to-primary flex flex-col items-center justify-center relative px-container-padding z-0">
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-primary mb-2">SiPanitia</h1>
<p class="font-body-md text-body-md text-on-primary opacity-80 max-w-[240px] mx-auto">Sistem Monitoring Kepanitiaan HUT RI</p>
</div>
</div>
<!-- Bottom 60% Form Area overlapping -->
<div class="flex-1 bg-surface rounded-t-[24px] -mt-[24px] z-10 px-container-padding pt-8 pb-safe relative shadow-[0_-4px_16px_rgba(0,0,0,0.1)] flex flex-col">
<div class="flex-1 w-full max-w-md mx-auto flex flex-col">
<form class="flex-1 flex flex-col space-y-4">
<!-- Email/Username Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="w-full h-12 pl-10 pr-3 bg-surface-container-lowest border border-[#D1D5DB] rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container text-on-surface font-body-md text-body-md placeholder-secondary transition-colors outline-none" placeholder="Email atau username" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="w-full h-12 pl-10 pr-10 bg-surface-container-lowest border border-[#D1D5DB] rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container text-on-surface font-body-md text-body-md placeholder-secondary transition-colors outline-none" id="passwordField" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-secondary hover:text-on-surface" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="visibilityIcon" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-[13px] text-primary-container font-semibold hover:underline" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full h-12 bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center" type="submit">
            Masuk
          </button>
</div>
</form>
<!-- Footer Text -->
<div class="mt-auto pb-6 text-center">
<p class="font-label-md text-label-md text-secondary">Belum punya akun? Hubungi Super Admin</p>
</div>
</div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePassword');
      const passwordField = document.getElementById('passwordField');
      const visibilityIcon = document.getElementById('visibilityIcon');

      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
      });
    });
  </script>
