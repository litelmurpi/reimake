<!DOCTYPE html>

<html lang="id"><head>

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-indicator::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0));
            pointer-events: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased flex justify-center items-center min-h-screen">
<div class="w-full max-w-md h-[884px] bg-surface flex flex-col relative overflow-hidden shadow-2xl">
<!-- Header -->
<header class="h-top-bar-height bg-surface flex items-center justify-center px-container-padding shrink-0 border-b border-divider relative z-10">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Tambah Tugas Acara</h1>
<button aria-label="Close" class="absolute right-container-padding text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Form Area -->
<main class="flex-1 overflow-y-auto no-scrollbar relative p-container-padding pb-32">
<!-- SECTION 1: INFO DASAR -->
<section class="mb-8">
<h2 class="text-[12px] font-bold text-secondary uppercase tracking-wider mb-4">INFO DASAR</h2>
<div class="space-y-4 bg-white p-4 rounded-xl border border-divider shadow-[0_1px_3px_rgba(0,0,0,0.08)]">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Sub-Event</label>
<select class="w-full h-12 px-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors">
<option value="">Pilih Sub-Event</option>
<option value="lomba_anak">Lomba Anak</option>
<option value="lomba_ibu">Lomba Ibu-Ibu</option>
<option value="outbound">Outbound</option>
<option value="tirakatan">Tirakatan</option>
<option value="jalan_sehat">Jalan Sehat</option>
</select>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Kebutuhan/Aspek Acara</label>
<input class="w-full h-12 px-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Contoh: Persiapan Clue Outbound" type="text"/>
</div>
<div class="space-y-1.5 relative">
<label class="font-label-md text-label-md text-on-surface">Target Tanggal</label>
<div class="relative">
<input class="w-full h-12 px-3 pl-10 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none" type="date"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">calendar_month</span>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Penanggung Jawab</label>
<div class="relative">
<select class="w-full h-12 pl-12 pr-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors appearance-none">
<option disabled="" selected="" value="">Cari Penanggung Jawab...</option>
<option value="1">Budi Santoso</option>
<option value="2">Siti Aminah</option>
</select>
<div class="absolute left-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-secondary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A small circular avatar placeholder image showing a professional corporate headshot of an individual on a solid light gray background, high key lighting, crisp focus, modern mobile app ui asset style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVl2ReM14Zj82l-eUmxsqC4sJxNtX0MEjcSGneoO3IVd6Yx2KTmwUjIqZdvadvhod8rXaGNsoUdJ8xQiIDllTcBKsZr9TbNSIJgVaey3cRFAXjwZuUmCaZkfqgWV6SZTPdPDDUR0cLZ6lH4fMEm7N47NFCQroaW_jp5cjQD7ZLlz7bDwMUSIiR0YslWG7pq8oVwR-Q8eAIYtAm9-1kMCYffaxNuFqBguC7oZrQ02rQ64v7OlKOTyITXqkob81lLfKMGY_sxhDrX9E"/>
</div>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-secondary pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Status</label>
<select class="w-full h-12 px-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors">
<option value="belum_mulai">Belum Mulai</option>
<option value="proses">Proses</option>
<option value="selesai">Selesai</option>
<option value="tertunda">Tertunda</option>
</select>
</div>
</div>
</section>
<!-- SECTION 2: DETAIL PELAKSANAAN -->
<section class="mb-8">
<h2 class="text-[12px] font-bold text-secondary uppercase tracking-wider mb-4">DETAIL PELAKSANAAN</h2>
<div class="space-y-4 bg-white p-4 rounded-xl border border-divider shadow-[0_1px_3px_rgba(0,0,0,0.08)]">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">MC / Pengisi Acara</label>
<input class="w-full h-12 px-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Contoh: Mas Bejo" type="text"/>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Perlengkapan Utama</label>
<input class="w-full h-12 px-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Contoh: 2 set bakiak, 5 ember" type="text"/>
</div>
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Detail Aturan/Rute/Deskripsi</label>
<textarea class="w-full min-h-[100px] p-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors resize-y" placeholder="Tuliskan detail pelaksanaan secara rinci..."></textarea>
</div>
</div>
</section>
<!-- SECTION 3: CONTINGENCY -->
<section class="mb-4 relative scroll-indicator">
<h2 class="text-[12px] font-bold text-secondary uppercase tracking-wider mb-4">CONTINGENCY</h2>
<div class="bg-white p-4 rounded-xl border border-divider shadow-[0_1px_3px_rgba(0,0,0,0.08)]">
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface">Catatan Plan B / Resiko</label>
<textarea class="w-full min-h-[80px] p-3 rounded-lg border-outline-variant bg-surface-lowest text-on-surface placeholder:text-secondary focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors resize-y" placeholder="Contoh: Jika hujan, pindah ke pendopo"></textarea>
</div>
</div>
</section>
</main>
<!-- Bottom Sticky Bar -->
<footer class="absolute bottom-0 w-full bg-surface border-t border-divider p-container-padding pb-safe z-20 flex gap-gutter shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="flex-1 h-[48px] rounded-lg border border-primary-container text-primary-container font-headline-sm text-headline-sm bg-white hover:bg-surface-container-low transition-colors flex items-center justify-center">
                Batal
            </button>
<button class="flex-1 h-[48px] rounded-lg bg-primary-container text-white font-headline-sm text-headline-sm hover:opacity-90 transition-opacity active:scale-95 flex items-center justify-center shadow-md">
                Simpan
            </button>
</footer>
</div>
</body></html>
